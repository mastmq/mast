# What every node in the soak stack shares. Each service in compose.yaml
# sets its role, its name and its cluster wiring through MAST__ variables,
# which override this file.

[log]
level = "info"

[mqtt]
addr = "0.0.0.0:1883"

[nats]
monitor_addr = "0.0.0.0:8222"

[session]
expiry = "1h"

[obs]
addr = "0.0.0.0:9090"

# Tenants come from a signed token, so one stack can hold several of them
# with different limits. The secret is generated by `./soak.sh init` into
# secrets/, which git ignores; `./soak.sh token <tenant>` mints a token.
[auth]
mode = "jwt"

[auth.jwt]
source = "username"
algorithms = ["HS256"]
hmac_secret_file = "/etc/mast/secrets/jwt.secret"
tenant_claim = "tenant"
limits_claim = "limits"

# Unlimited by default, so the load tenant measures the broker and not a
# limit. acme is a customer with room to spare; tiny is small enough that a
# smoke test or a careless load run hits every limit at once.
[limits.tenants.acme]
max_connections = 5000
publish_rate = 5000

[limits.tenants.tiny]
max_connections = 3
publish_rate = 5
publish_burst = 5
offline_queue = 10

[admin]
addr = "0.0.0.0:8080"
token_file = "/etc/mast/secrets/admin.token"

# A ratio rather than always_on: under a load run every publish would be a
# trace, and the collector and Jaeger would be what the soak measures. The
# smoke test publishes enough to catch a few. The ratio itself is
# MAST__TRACING__SAMPLER_ARG in compose.yaml, from TRACE_RATIO (0.05).
[tracing]
enabled = true
endpoint = "http://otel-collector:4318"
sampler = "parentbased_traceidratio"
