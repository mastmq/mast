# mast configuration. Every value here is the built-in default, so an empty
# file behaves exactly like no file at all.
#
# Environment variables override the file. Nesting uses a double underscore:
# MAST__MQTT__ADDR=":8883" sets mqtt.addr. List settings — core.routes,
# edge.core_urls and auth.jwt.algorithms — are comma-separated:
# MAST__EDGE__CORE_URLS="nats-leaf://a:7422,nats-leaf://b:7422"

# all-in-one runs both jobs in one process with no cluster, which is the right
# answer for an edge site or a laptop. Split into core and edge once the MQTT
# tier needs to scale and restart independently of Raft.
role = "all-in-one"

[log]
level = "info"   # debug, info, warn, error
format = "text"  # text or json

[mqtt]
addr = ":1883"
ws_addr = ""
tls_cert = ""
tls_key = ""
# A second listener that skips authentication and authorization entirely,
# for trusted in-cluster services. Empty disables it, and it should stay
# that way unless nothing outside the cluster can reach the address:
# whatever connects here is trusted completely.
internal_addr = ""
# The main driver of memory at high connection counts. Budget this times the
# connections you expect per process, not times the whole fleet.
max_writes_pending = 1024
connect_timeout = "10s"

[nats]
name = ""
# Empty means the embedded server is reachable in-process only — on a core,
# loopback on a random port, since a core cannot form routes without a client
# listener. Set it if you want the nats CLI against this node.
client_addr = ""
# Keep this on. Without it you have no visibility into your own data plane.
monitor_addr = "127.0.0.1:8222"

[core]
routes = []
listen_addr = ""
leaf_addr = ""
store_dir = "./data"  # must be a persistent volume in the core role
replicas = 1          # use 3 for a real core tier; read only by cores, edges bind to what they made

[edge]
core_urls = []        # required in the edge role
credentials = ""

[tenant]
# The tenant a connection joins when its authentication names none. In static
# mode that is every connection. auth.http (mast wire) takes the tenant from
# the service's reply and auth.jwt from a token claim, so there this applies
# only where they cannot name one: the emqx wire, which has no tenant field,
# and a token without the claim. Connections on the internal listener join it
# too. mast does not own tenant lifecycle; your identity system does.
default = "default"

[auth]
# static: one tenant, everything allowed. Appropriate only where the
#         deployment itself is the security boundary.
# http:   ask an HTTP service, posting the MQTT fields as JSON.
# jwt:    verify a signed token locally. Nothing goes on the network during
#         a reconnect storm; revocation is only as fast as token expiry.
mode = "static"

[auth.http]
# "mast", below, lets the service name the tenant. "emqx" speaks EMQX v5's
# http backend shape so a service written for EMQX works unchanged; EMQX has
# no tenant field, so tenant.default applies. See config.emqx-compat.toml.
wire = "mast"

# Posted on CONNECT:
#   {"client_id":"..","username":"..","password":"..","remote_addr":"..",
#    "protocol_version":5,"clean_start":true}
# Expected back:
#   {"allow":true,"tenant":"acme"}
# The tenant in that reply is authoritative for the whole connection.
authn_url = ""

# Posted on each publish and subscribe:
#   {"tenant":"..","client_id":"..","username":"..","remote_addr":"..",
#    "topic":"a/b","action":"publish"}
# Expected back:
#   {"allow":true}
# Leaving this empty means an authenticated connection may use any topic
# inside its own tenant, which is coherent when the tenant mount is boundary
# enough.
authz_url = ""

timeout = "2s"

# What to do when the service cannot be reached, for authorization only.
# "deny" makes a policy-server outage look like a broker outage; "allow"
# makes it look like an open door. Authentication always fails closed:
# admitting a connection whose tenant is unknown would mean inventing an
# isolation boundary.
on_error = "deny"

# Authorization is asked on every publish, so a zero TTL costs a network
# round trip per message. A failed call is never cached.
cache_ttl = "1m"
cache_size = 100000

# [auth.http.headers]
# Authorization = "Bearer ..."

# Read only in jwt mode. See config.jwt.toml for a worked setup; with
# auth.http.authz_url set alongside, topic decisions still go to a policy
# service, because a signature says who a connection is and not what it may
# do.
[auth.jwt]
# The CONNECT field carrying the token. "username" because many clients log
# passwords and none log usernames.
source = "username"
# Discard everything up to the first colon, for "<vendor>:<token>".
vendor_prefix = false
# Required in jwt mode, and there is deliberately no default: accepting
# whatever algorithm a token asks for is how "alg":"none" and RSA-to-HMAC
# confusion attacks work.
algorithms = []
# Exactly one key source in jwt mode. Prefer a file: a secret in a config
# file tends to end up in version control.
hmac_secret = ""
hmac_secret_file = ""
public_key_file = ""
# The claim naming the tenant. Empty, or a token without the claim, falls
# back to tenant.default.
tenant_claim = ""
# A boolean claim that bypasses authorization, as EMQX's is_superuser does.
superuser_claim = ""
# An object claim overriding the tenant's limits, with the keys of a
# [limits.tenants.<id>] entry: {"max_connections":500,"publish_rate":50}.
limits_claim = ""
# Checked against the token when set.
issuer = ""
audience = ""

[session]
# How long a disconnected session and its queued QoS 1/2 messages survive.
# Long enough for a device on a bad link or a rolling deploy, short enough
# that decommissioned hardware releases its storage.
expiry = "24h"

[fabric]
# Store every QoS 1 and 2 publish on a replicated JetStream stream before
# acknowledging it, and deliver it to other nodes from there, so a node cut
# off from the core for a moment catches up instead of losing what was
# published for its clients. One stream, one consumer per node. Off, QoS 1
# and 2 cross nodes at-most-once, like QoS 0.
durable_qos = true
# How long the stream keeps a message: how long a node can be cut off and
# still catch up.
durable_max_age = "5m"

[obs]
addr = "127.0.0.1:9090"  # /metrics, /healthz, /readyz and net/http/pprof
# How many tenants get a metric label of their own on a node. The rest are
# counted together under tenant="~other". 0 is unbounded, which is fine
# for a handful of tenants and a Prometheus outage for ten thousand.
max_tenant_labels = 1000

[limits]
# Every tenant's limits. A tenant's entry under [limits.tenants] overrides
# them field by field, and the authentication backend can override both: the
# "limits" object in an HTTP reply, or auth.jwt.limits_claim. The newest
# statement wins (a JWT's iat, an HTTP reply's arrival), and one that names
# no limits leaves the tenant's overrides as they were.
#
# Cluster-wide. Nodes exchange counts every sync_interval on core NATS, so
# connections arriving on several nodes at once can overshoot by what they
# accept within one interval. Refused with CONNACK 0x97 Quota exceeded on
# MQTT 5 and 0x03 Server unavailable on 3.1.1. 0 is unlimited.
max_connections = 0
# PUBLISH packets per second per tenant, enforced per node. QoS 0 past it is
# dropped; MQTT 5 QoS 1 gets PUBACK 0x96 Message rate too high; MQTT 5 QoS 2
# and MQTT 3.1.1 QoS 1/2 are disconnected. 0 is unlimited.
publish_rate = 0
# Publishes that may arrive at once before the rate applies. 0 is one
# second's worth.
publish_burst = 0
# QoS 1/2 messages kept for one absent session, newest first. The largest
# value configured here or under [limits.tenants] is what the offline stream
# keeps per session; an authentication override can only lower it. It also
# bounds what a device returning to the node it left is resent, which before
# limits was everything mochi held, up to thousands.
offline_queue = 100
sync_interval = "2s"

# [limits.tenants.acme]
# max_connections = 5000
# publish_rate = 200

[admin]
# The administrative HTTP API: list a tenant's sessions, read one, disconnect
# a client, and a tenant's counts, across the whole cluster from any node.
# Empty serves no API. Its own listener, apart from obs.addr, because this
# one can disconnect devices; keep it off the public network.
addr = ""
# The bearer token every request presents, read once at startup. Required
# when addr is set, at least 16 bytes, surrounding whitespace ignored. There
# is no setting for the token itself, so it cannot end up in this file.
token_file = ""
# How long to wait for every node to answer a list or stats request. A node
# slower than this is missing from that response, which says how many nodes
# answered. Every list and stats request waits this long; at most 5s.
gather = "500ms"

[tracing]
# OpenTelemetry traces of the message path: publish, the durable store, the
# fabric between nodes, and delivery. Off, no tracer exists and a publish
# pays one branch for it. Every other key here defers to its standard
# OTEL_* variable when empty, and OTEL_SERVICE_NAME, OTEL_RESOURCE_ATTRIBUTES
# and OTEL_EXPORTER_OTLP_HEADERS are honoured as they are anywhere else.
enabled = false
# The OTLP/HTTP collector, e.g. "http://otel-collector:4318"; an http scheme
# means plain text. Empty: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, then
# OTEL_EXPORTER_OTLP_ENDPOINT, then http://localhost:4318.
endpoint = ""
# An OTEL_TRACES_SAMPLER name: always_on, always_off, traceidratio,
# parentbased_always_on, parentbased_always_off, parentbased_traceidratio.
# Empty: OTEL_TRACES_SAMPLER, then parentbased_always_on.
sampler = ""
# The ratio for the traceidratio samplers, e.g. "0.01". Empty:
# OTEL_TRACES_SAMPLER_ARG, then 1. Each key defers on its own, so either one
# may come from the environment. A client's sampled flag never decides.
sampler_arg = ""
