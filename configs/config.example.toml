# mast configuration. Every value here is the built-in default, so an empty
# file behaves exactly like no file at all.
#
# Environment variables override the file. Nesting uses a double underscore:
# MAST__MQTT__ADDR=":8883" sets mqtt.addr. List settings — core.routes,
# edge.core_urls and auth.jwt.algorithms — are comma-separated:
# MAST__EDGE__CORE_URLS="nats-leaf://a:7422,nats-leaf://b:7422"

# all-in-one runs both jobs in one process with no cluster, which is the right
# answer for an edge site or a laptop. Split into core and edge once the MQTT
# tier needs to scale and restart independently of Raft.
role = "all-in-one"

[log]
level = "info"   # debug, info, warn, error
format = "text"  # text or json

[mqtt]
addr = ":1883"
ws_addr = ""
tls_cert = ""
tls_key = ""
# A second listener that skips authentication and authorization entirely,
# for trusted in-cluster services. Empty disables it, and it should stay
# that way unless nothing outside the cluster can reach the address:
# whatever connects here is trusted completely.
internal_addr = ""
# The main driver of memory at high connection counts. Budget this times the
# connections you expect per process, not times the whole fleet.
max_writes_pending = 1024
connect_timeout = "10s"

[nats]
name = ""
# Empty means the embedded server is reachable in-process only. Set it if you
# want the nats CLI against this node.
client_addr = ""
# Keep this on. Without it you have no visibility into your own data plane.
monitor_addr = "127.0.0.1:8222"

[core]
routes = []
listen_addr = ""
leaf_addr = ""
store_dir = "./data"  # must be a persistent volume in the core role
replicas = 1          # use 3 for a real core tier

[edge]
core_urls = []        # required in the edge role
credentials = ""

[tenant]
# Every connection resolves to this tenant while mast ships only the static
# resolver. A real deployment replaces the resolver with one backed by its own
# identity system, exactly as BifroMQ's auth provider does: mast does not own
# tenant lifecycle.
default = "default"

[auth]
# static: one tenant, everything allowed. Appropriate only where the
#         deployment itself is the security boundary.
# http:   ask an HTTP service, posting the MQTT fields as JSON.
# jwt:    verify a signed token locally. Nothing goes on the network during
#         a reconnect storm; revocation is only as fast as token expiry.
mode = "static"

[auth.http]
# "mast", below, lets the service name the tenant. "emqx" speaks EMQX v5's
# http backend shape so a service written for EMQX works unchanged; EMQX has
# no tenant field, so tenant.default applies. See config.emqx-compat.toml.
wire = "mast"

# Posted on CONNECT:
#   {"client_id":"..","username":"..","password":"..","remote_addr":"..",
#    "protocol_version":5,"clean_start":true}
# Expected back:
#   {"allow":true,"tenant":"acme"}
# The tenant in that reply is authoritative for the whole connection.
authn_url = ""

# Posted on each publish and subscribe:
#   {"tenant":"..","client_id":"..","username":"..","remote_addr":"..",
#    "topic":"a/b","action":"publish"}
# Expected back:
#   {"allow":true}
# Leaving this empty means an authenticated connection may use any topic
# inside its own tenant, which is coherent when the tenant mount is boundary
# enough.
authz_url = ""

timeout = "2s"

# What to do when the service cannot be reached, for authorization only.
# "deny" makes a policy-server outage look like a broker outage; "allow"
# makes it look like an open door. Authentication always fails closed:
# admitting a connection whose tenant is unknown would mean inventing an
# isolation boundary.
on_error = "deny"

# Authorization is asked on every publish, so a zero TTL costs a network
# round trip per message. A failed call is never cached.
cache_ttl = "1m"
cache_size = 100000

# [auth.http.headers]
# Authorization = "Bearer ..."

# Read only in jwt mode. See config.jwt.toml for a worked setup; with
# auth.http.authz_url set alongside, topic decisions still go to a policy
# service, because a signature says who a connection is and not what it may
# do.
[auth.jwt]
# The CONNECT field carrying the token. "username" because many clients log
# passwords and none log usernames.
source = "username"
# Discard everything up to the first colon, for "<vendor>:<token>".
vendor_prefix = false
# Required in jwt mode, and there is deliberately no default: accepting
# whatever algorithm a token asks for is how "alg":"none" and RSA-to-HMAC
# confusion attacks work.
algorithms = []
# Exactly one key source in jwt mode. Prefer a file: a secret in a config
# file tends to end up in version control.
hmac_secret = ""
hmac_secret_file = ""
public_key_file = ""
# The claim naming the tenant. Empty, or a token without the claim, falls
# back to tenant.default.
tenant_claim = ""
# A boolean claim that bypasses authorization, as EMQX's is_superuser does.
superuser_claim = ""
# Checked against the token when set.
issuer = ""
audience = ""

[session]
# How long a disconnected session and its queued QoS 1/2 messages survive.
# Long enough for a device on a bad link or a rolling deploy, short enough
# that decommissioned hardware releases its storage.
expiry = "24h"

[obs]
addr = "127.0.0.1:9090"  # /metrics and net/http/pprof
