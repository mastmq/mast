# Configuration for replacing an EMQX v5 cluster that authenticates against
# an HTTP service, which is the shape snapp-incubator/soteria expects.
#
# It mirrors these EMQX settings:
#
#   EMQX_AUTHENTICATION__1__BACKEND      http     -> auth.mode + auth.http.wire
#   EMQX_AUTHENTICATION__1__URL          .../auth -> auth.http.authn_url
#   EMQX_AUTHORIZATION__SOURCES__1__URL  .../acl  -> auth.http.authz_url
#   EMQX_AUTHORIZATION__NO_MATCH         deny     -> auth.http.on_error = deny
#   EMQX_LISTENERS__TCP__INTERNAL__BIND  11883    -> mqtt.internal_addr
#   EMQX_LISTENERS__TCP__INTERNAL__ENABLE_AUTHN false -> the internal listener
#                                                       skips auth by design

role = "all-in-one"

[log]
level = "info"
format = "json"

[mqtt]
addr = "0.0.0.0:1883"
# Trusted in-cluster services, no credential required. Never expose this
# outside the cluster: whatever reaches it is trusted completely.
internal_addr = "0.0.0.0:11883"

[nats]
monitor_addr = "0.0.0.0:8222"

[core]
store_dir = "/data"
replicas = 1

[tenant]
# EMQX has no notion of a tenant, so every connection lands in this one.
# It is still the isolation boundary inside mast, and the value becomes a
# subject token, so keep it to [A-Za-z0-9_-].
default = "ignite"

[auth]
mode = "http"

[auth.http]
# Speak EMQX v5's http backend shape, so the existing auth service needs no
# change. Requests carry token, username, password and client_id for
# authentication and topic and action for authorization; a reply is
# {"result":"allow"|"deny"} with HTTP 200 either way. The token repeats the
# username because that is how these deployments carry a bearer credential.
wire = "emqx"
authn_url = "http://soteria:9999/v2/auth"
authz_url = "http://soteria:9999/v2/acl"
timeout = "2s"

# EMQX's NO_MATCH=deny. Authentication always fails closed regardless.
on_error = "deny"

# Authorization is asked on every publish. EMQX caches too; set 0s if a
# revoked ACL must take effect instantly, and accept a round trip per message.
cache_ttl = "1m"
cache_size = 100000

[obs]
addr = "0.0.0.0:9090"
