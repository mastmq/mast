---
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - run: go test -race ./... -covermode=atomic -coverprofile=coverage.out
      - uses: codecov/codecov-action@v5
        with:
          files: coverage.out
        continue-on-error: true

  # A dependency can become vulnerable without a single line of our code
  # changing, so this runs on every push rather than only on dependency
  # bumps. It fails only on vulnerabilities actually reachable from our
  # code; an unreachable one in the module graph is noise, and treating
  # noise as failure is how a red pipeline stops meaning anything.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The topic codec is baked into stored subjects and authorization rules, so
  # a round-trip regression is a data-loss bug. Fuzz it on every change.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - run: go test -run='^$' -fuzz=FuzzRoundTrip -fuzztime=60s ./internal/domain/topic/

  build:
    needs: [lint, test, vuln]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - run: go build ./cmd/mast
