---
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write
  # Keyless signing: cosign trades the workflow's OIDC token for a
  # short-lived Sigstore certificate naming this workflow and ref, so there
  # is no signing key to store, rotate or leak.
  id-token: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # A pull request builds but does not publish: it is there to catch a
      # broken Dockerfile before it reaches main, not to produce artifacts.
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: build/package/Dockerfile
          # arm64 too: the release ships arm64 binaries and the Ansible role
          # installs them, so an amd64-only image left Graviton nodes and
          # Apple Silicon laptops as the one place mast could not run.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Stored in the registry beside the image, per platform, so they
          # travel with it to any mirror. mode=max records the build's
          # inputs in full, which is what makes the provenance worth reading.
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@v4.1.3
        if: github.event_name != 'pull_request'

      # The digest, not a tag: a tag can be moved to another image after it
      # was signed, a digest cannot. Signing the index covers both
      # platforms, since cosign verify resolves a tag to the same index.
      - name: sign
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
